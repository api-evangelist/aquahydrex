aid: aquahydrex

name: AquaHydrex

description: >-
  AquaHydrex was a green-hydrogen technology company that developed a redesigned high-pressure
  alkaline water electrolysis system for large-scale hydrogen production. Founded in 2012 as a
  spin-out of the University of Wollongong and Monash University (ARC Centre of Excellence for
  Electromaterials Science), it opened its North American headquarters in Louisville, Colorado in
  2015 and raised about $25 million, including a January 2023 round led by AP Ventures with Aramco
  Ventures. It filed for Chapter 7 bankruptcy in October 2023 (D. Colo. 1:23-bk-14706). It published
  no API. It was harvested from a Nasdaq Private Market listing, which an earlier pass mistook for
  the company and described as a liquidity and secondary-market platform.

