aid: aquahydrex

name: AquaHydrex

description: 'AquaHydrex is a private‑market technology company that provides liquidity solutions, secondary market platforms, and equity administration services for private companies and investors. It enables buying and selling of pre‑IPO shares, offers structured liquidity programs, and delivers data intelligence on private market pricing and valuations. Through its marketplace, AquaHydrex connects vetted buyers with shareholders, facilitating transparent and regulated transactions in the private equity space.'

